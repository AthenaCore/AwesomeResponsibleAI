name: restore-readme
on:
  push:
    paths:
      - '.github/workflows/restore-readme.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-csoai-gspc
      - name: Fetch and write README.md
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib, urllib.request
          url = 'https://huggingface.co/datasets/Nicholastempleman/dir-pr-restore/resolve/main/athena-readme.md.gz.b64'
          b64 = urllib.request.urlopen(url, timeout=120).read().decode().strip()
          raw = gzip.decompress(base64.b64decode(b64))
          pathlib.Path('README.md').write_bytes(raw)
          print('wrote README.md', len(raw))
          assert b'Council of AI' in raw
          assert b'Frameworks' in raw or b'framework' in raw.lower()
          PY
      - name: Commit README.md and cleanup helpers
        run: |
          git config user.name "Nicholas Templeman"
          git config user.email "nicholas@csoai.org"
          git add README.md
          git rm -rf _restore .github/workflows/restore-readme.yml || true
          git commit -m "Add Council of AI GSPC under Frameworks" || true
          git push
